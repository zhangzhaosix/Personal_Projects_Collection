  <script>
    (() => {
      const entry = performance.getEntriesByType('navigation')[0];
      window.__shineReload = entry ? entry.type === 'reload' : performance.navigation?.type === 1;
      window.__shineBackForward = entry ? entry.type === 'back_forward' : performance.navigation?.type === 2;
      if ('scrollRestoration' in history) history.scrollRestoration = window.__shineReload ? 'manual' : 'auto';
      if (!window.__shineReload) return;
      // 刷新从首屏重新开始；正常直达锚点和历史返回沿用浏览器行为。
      document.documentElement.style.overflowAnchor = 'none';
      if (location.hash) history.replaceState(history.state, '', location.pathname + location.search);
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      window.addEventListener('pagehide', () => { history.scrollRestoration = 'auto'; });
    })();
  </script>
