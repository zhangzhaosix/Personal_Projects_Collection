<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 · Shine</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=20261029-2">
  <link rel="stylesheet" href="css/project-preview.css?v=20261029-3">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Shine</a>
      <div class="nav-links">
        <a href="index.html" class="nav-item">首页</a>
        <a href="works.html" class="nav-item active" aria-current="page">作品</a>
        <a href="notes.html" class="nav-item">笔记</a>
        <a href="contact.html" class="nav-item">联系</a>
      </div>
    </div>
  </nav>

  <div class="works-page">
    <!-- 页面头部 Hero -->
    <section class="page-hero fade-in">
      <div class="page-hero-content">
        <h1 class="page-hero-title">作品集</h1>
        <p class="page-hero-sub">实习作品集：SQL 取数 · 自动化报表 · BI 可视化 · 分析复盘</p>
      </div>
    </section>

    <!-- 作品网格 -->
    <div class="project-grid" id="worksGrid">
      <!-- 由 JS 动态渲染 -->
    </div>

    <!-- 分页器 -->
    <div class="pagination" id="worksPagination">
      <!-- 由 JS 动态渲染 -->
    </div>

    <!-- 页脚 -->
    <footer class="contact-section">
      <div class="contact-inner">
        <a href="mailto:1801327763@qq.com" class="contact-link" title="发送邮件">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <span>1801327763@qq.com</span>
        </a>
        <span class="contact-copyright">© 2026 Shine</span>
      </div>
    </footer>
  </div>

  <!-- 浮动管理按钮 -->
  <button class="fab" id="fabManage" title="管理模式">⚙</button>
  <button class="fab-add" id="fabAdd" title="添加作品">+</button>
  <button class="back-to-top" id="backToTop" title="Back To Top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <div class="toast-container" id="toastContainer"></div>

  <!-- 密码验证模态框 -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-box" style="max-width:380px;">
      <div class="modal-title" style="text-align:center;">管理员登录</div>
      <p class="admin-network-notice">管理和发布需要连接云端，请先开启 VPN。普通浏览无需开启。</p>
      <div class="modal-body">
        <label class="field-label" for="inputLoginEmail">登录邮箱</label>
        <input type="email" class="input-field" id="inputLoginEmail" value="1801327763@qq.com" readonly style="font-size:15px;">
        <label class="field-label" for="inputLoginPassword">登录密码</label>
        <input type="password" class="input-field" id="inputLoginPassword" placeholder="请输入密码" autocomplete="current-password" style="text-align:center;font-size:18px;letter-spacing:4px;">
        <p id="loginError" class="field-error" style="display:none;">登录失败，请检查邮箱 / 密码或 Firebase 配置。</p>
      </div>
      <div class="modal-footer" style="justify-content:center;">
        <button class="btn btn-outline" id="btnPwdCancel">取消</button>
        <button class="btn btn-solid" id="btnPwdConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑作品模态框 -->
  <div class="modal-overlay project-form-modal" id="formModal">
    <div class="modal-box">
      <div class="modal-title" id="formModalTitle">添加作品</div>
      <div class="modal-body">
        <label class="field-label" for="inputName">作品名称</label>
        <input type="text" class="input-field" id="inputName" placeholder="作品名称" maxlength="50">
        <label class="field-label" for="selectProjectType">项目类型（必选）</label>
        <select class="input-field" id="selectProjectType" required>
          <option value="">请选择项目类型</option>
        </select>
        <div id="customProjectTypeField" hidden>
          <label class="field-label" for="inputCustomProjectType">自定义项目类型</label>
          <input type="text" class="input-field" id="inputCustomProjectType" placeholder="例如：Vibe Coding 项目" maxlength="30" disabled>
        </div>
        <label class="field-label" for="inputUrl">作品网址</label>
        <input type="text" class="input-field" id="inputUrl" placeholder="作品网址（可选）" maxlength="500">
        <label class="field-label" for="inputDesc">作品简介</label>
        <textarea class="input-field" id="inputDesc" placeholder="作品简介" maxlength="200" rows="3"></textarea>
        <label class="field-label" for="inputRole">职责</label>
        <textarea class="input-field" id="inputRole" placeholder="你在项目中的具体职责，例如：指标体系梳理与看板搭建" maxlength="180" rows="2"></textarea>
        <label class="field-label" for="inputTools">工具 / 方法</label>
        <textarea class="input-field" id="inputTools" placeholder="使用的工具或分析方法，例如：SQL · Power BI · 漏斗分析" maxlength="180" rows="2"></textarea>
        <label class="field-label" for="inputOutcome">产出</label>
        <textarea class="input-field" id="inputOutcome" placeholder="可核实的产出或决策支持，例如：完成复盘报告，支持投放策略优化" maxlength="220" rows="2"></textarea>
        <label class="field-label" for="inputTags">标签</label>
        <input type="text" class="input-field" id="inputTags" placeholder="用逗号分隔，例如：数据分析, BI" maxlength="200">
        <p id="formError" class="field-error" role="alert" style="display:none;">保存失败，请重试。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btnFormCancel">取消</button>
        <button class="btn btn-solid" id="btnFormSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay confirm-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="confirm-text">确定要删除这个作品吗？</div>
      <div class="confirm-sub" id="confirmProjectName"></div>
      <div class="modal-footer" style="justify-content:center;">
        <button class="btn btn-outline" id="btnConfirmCancel">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-portfolio.js"></script>
  <script src="js/project-text.js?v=20261029-2"></script>
  <script src="js/publish.js"></script>
  <script src="js/project-preview.js?v=20261029-8"></script>
  <script src="js/works.js?v=20261029-2"></script>
</body>
</html>
